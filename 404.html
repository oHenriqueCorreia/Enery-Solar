<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Página não encontrada | SolarEnergy</title>
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <link rel="stylesheet" href="styles.css" />
  <style>
    .error-page {
      min-height: 100vh;
      display: flex;
      align-items: center;
      justify-content: center;
      background: linear-gradient(135deg, var(--color-primary) 0%, #0a0a0a 100%);
      padding: 2rem;
      text-align: center;
    }
    .error-content { max-width: 600px; color: #fff; }
    .error-code {
      font-size: clamp(5rem, 18vw, 10rem);
      font-weight: 900;
      line-height: 1;
      color: var(--color-accent);
      text-shadow: 0 4px 30px rgba(244, 193, 58, 0.3);
      margin-bottom: 1rem;
    }
    .error-title {
      font-size: clamp(1.5rem, 4vw, 2.2rem);
      color: #fff;
      margin-bottom: 1rem;
    }
    .error-text {
      color: rgba(255,255,255,0.7);
      font-size: 1.05rem;
      line-height: 1.7;
      margin-bottom: 2.5rem;
    }
    .error-actions { display: flex; gap: 1rem; justify-content: center; flex-wrap: wrap; }
    .btn-secondary {
      background-color: transparent;
      color: #fff;
      border: 2px solid rgba(255,255,255,0.25);
    }
    .btn-secondary:hover {
      background-color: rgba(255,255,255,0.08);
      border-color: #fff;
      transform: translateY(-2px);
    }
  </style>
</head>
<body>
  <section class="error-page">
    <div class="error-content">
      <div class="error-code">404</div>
      <h1 class="error-title">Página não encontrada</h1>
      <p class="error-text">A página que você procura pode ter sido removida, renomeada ou está temporariamente indisponível. Retorne à página inicial ou entre em contato com nossa equipe.</p>
      <div class="error-actions">
        <a href="index.html" class="btn btn-primary">Voltar para Home</a>
        <a href="contato.html" class="btn btn-secondary">Falar com a SolarEnergy</a>
      </div>
    </div>
  </section>
</body>
</html>
